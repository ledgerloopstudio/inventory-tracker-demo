<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Tracker</title>
<style>
:root{
  --bg:#F4F6F7; --card:#FFFFFF; --ink:#1B2A36; --ink2:#31485A; --grey:#5A6B78;
  --rule:#E2E6E9; --soft:#F7F8F9; --acc:#0F7B6C; --accL:#E6F2F0;
  --ok:#12B76A; --warn:#B9770E; --bad:#C0392B; --navy:#2E5C8A;
}
[data-dark="1"]{
  --bg:#121A1E; --card:#182226; --ink:#EDEFEF; --ink2:#C7D0D3; --grey:#8FA0A7;
  --rule:#28343A; --soft:#1B262B; --accL:#173832;
}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);}
.app{max-width:1200px;margin:0 auto;}
header.top{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:10;}
.toprow{display:flex;align-items:center;gap:20px;padding:14px 22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;font-size:19px;}
.brand .box{width:22px;height:22px;border:3px solid var(--acc);border-radius:6px;}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;}
nav.tabs button{background:none;border:none;padding:9px 14px;border-radius:8px;font-size:15px;font-weight:bold;color:var(--grey);cursor:pointer;}
nav.tabs button.active{background:var(--accL);color:var(--acc);}
.spacer{flex:1;}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink2);font-size:13px;font-weight:bold;}
main{padding:22px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr;}.grid2{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:18px;}
.kpi .label{font-size:12px;font-weight:bold;color:var(--grey);letter-spacing:.03em;text-transform:uppercase;}
.kpi .val{font-size:30px;font-weight:bold;margin:6px 0 2px;}
.kpi .sub{font-size:12px;color:var(--grey);}
h2{font-size:19px;margin:0 0 4px;}
p.hint{font-size:13px;color:var(--grey);margin:0 0 14px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--grey);padding:8px 10px;border-bottom:1px solid var(--rule);}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold;}
.pill.ok{background:var(--accL);color:var(--acc);}
.pill.low{background:#FCE8CB;color:var(--warn);}
.pill.out{background:#F5D9D6;color:var(--bad);}
.pill.archived{background:var(--soft);color:var(--grey);}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:bold;font-size:14px;cursor:pointer;}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ink2);}
.btn.small{padding:6px 10px;font-size:12px;border-radius:6px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--rule);border-radius:7px;background:var(--soft);color:var(--ink);width:100%;}
label{font-size:12px;font-weight:bold;color:var(--grey);display:block;margin-bottom:4px;}
.field{margin-bottom:12px;}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,18,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:24px;max-width:520px;width:100%;}
.modal h3{margin-top:0;}
.catbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.catbar .track{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden;}
.catbar .fill{height:100%;background:var(--acc);}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule);}
.list-item:last-child{border-bottom:none;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
.empty{color:var(--grey);font-size:13px;padding:20px 0;text-align:center;}
footer.note{font-size:12px;color:var(--grey);text-align:center;padding:20px;}
.demo-banner{position:sticky;top:0;z-index:9999;background:#B9770E;color:#fff;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:9px 14px}
.demo-banner a{color:#fff;text-decoration:underline}
.demo-banner .x{position:absolute;right:10px;top:6px;background:none;border:none;color:#fff;font:inherit;cursor:pointer;opacity:.85;padding:4px 8px}
.demo-banner .x:hover{opacity:1}
.buildstamp{max-width:1180px;margin:0 auto;padding:4px 22px 30px;color:#8A9AA5;font-size:11px;letter-spacing:.04em;text-align:right}
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner">DEMO â example data, add up to 15 of your own items and see whether it thinks the way you do. Nothing is saved permanently and it can reset any time. <a href="https://www.etsy.com/shop/LedgerLoopStudio" target="_blank" rel="noopener">Buy the full version</a> for your own unlimited, permanent copy.<button class="x" onclick="document.getElementById('demoBanner').style.display='none'" aria-label="Dismiss">â</button></div>
<div class="app" id="app"></div>

<script id="engine">
/* ===================== PURE FUNCTIONS (unit-testable) ===================== */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseISO(s){
  if(!s) return null;
  var p = String(s).split("-");
  if(p.length!==3) return null;
  var y=parseInt(p[0],10), m=parseInt(p[1],10), d=parseInt(p[2],10);
  if(!y||!m||!d) return null;
  return new Date(y, m-1, d);
}
function todayISO(){ return toISO(new Date()); }
function daysBetween(a,b){
  var MS=86400000;
  return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()) - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/MS);
}
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }

function activeItems(items){ return (items||[]).filter(function(i){ return i.status === "active"; }); }
function stockValue(items){
  return activeItems(items).reduce(function(sum,i){ return sum + (Number(i.qty)||0) * (Number(i.unitCost)||0); }, 0);
}
function retailValue(items){
  return activeItems(items).reduce(function(sum,i){ return sum + (Number(i.qty)||0) * (Number(i.unitPrice)||0); }, 0);
}
function potentialProfit(items){ return retailValue(items) - stockValue(items); }
function totalUnits(items){
  return activeItems(items).reduce(function(sum,i){ return sum + (Number(i.qty)||0); }, 0);
}
function lowStockItems(items){
  return activeItems(items)
    .filter(function(i){ return (Number(i.qty)||0) <= (Number(i.reorderPoint)||0); })
    .sort(function(a,b){ return (Number(a.qty)||0) - (Number(b.qty)||0); });
}
function outOfStockCount(items){
  return activeItems(items).filter(function(i){ return (Number(i.qty)||0) <= 0; }).length;
}
function categoryTotals(items){
  var out = {};
  activeItems(items).forEach(function(i){
    var c = i.category || "Other";
    out[c] = (out[c] || 0) + (Number(i.qty)||0) * (Number(i.unitCost)||0);
  });
  return out;
}
function mostValuable(items){
  var a = activeItems(items);
  if(!a.length) return null;
  return a.reduce(function(max,i){
    var v = (Number(i.qty)||0) * (Number(i.unitCost)||0);
    var mv = (Number(max.qty)||0) * (Number(max.unitCost)||0);
    return v > mv ? i : max;
  });
}

/* Weighted-average cost update on a stock receipt -- the differentiator over a plain
   spreadsheet's "just overwrite the cost cell" approach. Sale/adjustment never touch cost. */
function applyMovement(item, type, qty, unitCost){
  qty = Number(qty) || 0;
  var out = { id: item.id, sku: item.sku, name: item.name, category: item.category,
              qty: Number(item.qty)||0, reorderPoint: item.reorderPoint,
              unitCost: Number(item.unitCost)||0, unitPrice: item.unitPrice,
              status: item.status, notes: item.notes };
  if(type === "purchase"){
    var oldQty = out.qty, oldCost = out.unitCost;
    var newQty = oldQty + qty;
    var addedCost = unitCost === undefined || unitCost === null || unitCost === "" ? oldCost : Number(unitCost);
    out.unitCost = newQty > 0 ? ((oldQty * oldCost) + (qty * addedCost)) / newQty : addedCost;
    out.qty = newQty;
  } else if(type === "sale"){
    out.qty = Math.max(0, out.qty - qty);
  } else if(type === "adjustment"){
    out.qty = Math.max(0, out.qty + qty);
  }
  return out;
}

function recentMovements(movements, sinceISO, todayStr){
  var since = parseISO(sinceISO), today = parseISO(todayStr || todayISO());
  return (movements||[]).filter(function(m){
    var d = parseISO(m.date);
    if(!d) return false;
    return daysBetween(since, d) >= 0 && daysBetween(d, today) >= 0;
  });
}
function topMovers(movements, items, sinceISO, todayStr){
  var recent = recentMovements(movements, sinceISO, todayStr).filter(function(m){ return m.type === "sale"; });
  var totals = {};
  recent.forEach(function(m){ totals[m.itemId] = (totals[m.itemId]||0) + (Number(m.qty)||0); });
  return Object.keys(totals).map(function(id){
    var item = (items||[]).find(function(i){ return i.id === id; });
    return { item: item, unitsSold: totals[id] };
  }).filter(function(x){ return x.item; })
    .sort(function(a,b){ return b.unitsSold - a.unitsSold; });
}
function daysOfStock(qty, avgDailyUnits){
  qty = Number(qty)||0;
  if(!avgDailyUnits || avgDailyUnits <= 0) return null;
  return Math.round(qty / avgDailyUnits);
}
function formatMoney(amount, symbol){
  symbol = symbol || "$";
  var n = Math.round((Number(amount)||0) * 100) / 100;
  return symbol + n.toFixed(2);
}
function uid(){ return "i" + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

if(typeof module !== "undefined" && module.exports){
  module.exports = {
    pad2, toISO, parseISO, todayISO, daysBetween, addDays, activeItems, stockValue, retailValue,
    potentialProfit, totalUnits, lowStockItems, outOfStockCount, categoryTotals, mostValuable,
    applyMovement, recentMovements, topMovers, daysOfStock, formatMoney, uid
  };
}
</script>

<script id="uiapp">
(function(){
"use strict";
var KEY = "llsInventoryTracker_v1";
/* ---- demo-only limit: this block exists only in the public try-it demo, never in the sold product ---- */
var DEMO_MODE = true, DEMO_ITEM_LIMIT = 23; /* 8 seeded + 15 room to try adding your own */
function demoLimitReached(){
  if(!DEMO_MODE) return false;
  if(!STATE || !STATE.items || STATE.items.length < DEMO_ITEM_LIMIT) return false;
  alert("You've reached the "+DEMO_ITEM_LIMIT+"-item demo limit.\n\nThis is just a preview â buy the full version for unlimited items, all features unlocked, and your own permanent copy.");
  return true;
}
var CATEGORIES = ["Raw Materials","Finished Goods","Packaging","Merchandise","Supplies","Other"];

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return null;
    var st = JSON.parse(raw);
    if(!st || !st.items) return null;
    return st;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(STATE)); }catch(e){} }

function seedSample(){
  var today = todayISO();
  var t = parseISO(today);
  function iso(offsetDays){ return toISO(addDays(t, offsetDays)); }
  var items = [
    { id: uid(), sku: "CAND-LAV-08", name: "Lavender Candle 8oz", category: "Finished Goods", qty: 42, reorderPoint: 20, unitCost: 4.20, unitPrice: 14.99, status: "active", notes: "" },
    { id: uid(), sku: "WAX-SOY-BULK", name: "Soy Wax (bulk, per lb)", category: "Raw Materials", qty: 18, reorderPoint: 25, unitCost: 3.10, unitPrice: 0, status: "active", notes: "Reorder from supplier" },
    { id: uid(), sku: "JAR-8OZ-AMB", name: "Amber Glass Jar 8oz", category: "Packaging", qty: 6, reorderPoint: 30, unitCost: 0.85, unitPrice: 0, status: "active", notes: "Running low" },
    { id: uid(), sku: "TOTE-CANV-M", name: "Canvas Tote Bag (M)", category: "Merchandise", qty: 15, reorderPoint: 10, unitCost: 3.75, unitPrice: 12.00, status: "active", notes: "" },
    { id: uid(), sku: "LABEL-ROLL", name: "Label Roll (500ct)", category: "Supplies", qty: 3, reorderPoint: 5, unitCost: 8.50, unitPrice: 0, status: "active", notes: "" },
    { id: uid(), sku: "CAND-VAN-08", name: "Vanilla Candle 8oz", category: "Finished Goods", qty: 0, reorderPoint: 15, unitCost: 4.20, unitPrice: 14.99, status: "active", notes: "Sold out" },
    { id: uid(), sku: "WICK-COTTON", name: "Cotton Wicks (100ct)", category: "Raw Materials", qty: 60, reorderPoint: 20, unitCost: 0.12, unitPrice: 0, status: "active", notes: "" },
    { id: uid(), sku: "OLD-STICKER", name: "Old Sticker Sheets", category: "Merchandise", qty: 4, reorderPoint: 0, unitCost: 0.50, unitPrice: 2.00, status: "archived", notes: "Discontinued design" }
  ];
  var lav = items[0], tote = items[3];
  var movements = [
    { id: uid(), itemId: lav.id, type: "purchase", qty: 50, date: iso(-25), unitCost: 4.00, notes: "Initial batch" },
    { id: uid(), itemId: lav.id, type: "sale", qty: 8, date: iso(-10), notes: "" },
    { id: uid(), itemId: lav.id, type: "purchase", qty: 10, date: iso(-5), unitCost: 4.60, notes: "Top-up order, price rose" },
    { id: uid(), itemId: lav.id, type: "sale", qty: 10, date: iso(-2), notes: "" },
    { id: uid(), itemId: tote.id, type: "purchase", qty: 20, date: iso(-30), unitCost: 3.75, notes: "" },
    { id: uid(), itemId: tote.id, type: "sale", qty: 5, date: iso(-3), notes: "" }
  ];
  return { settings: { currency: "$", dark: false }, items: items, movements: movements };
}

var STATE = load() || seedSample();
if(!load()) save();

var VIEW = "dash";
var MODAL_OPEN = false;
var EDIT_ID = null;
var MOVE_ITEM_ID = null;

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  });
  (kids||[]).forEach(function(k){ if(k) e.appendChild(typeof k === "string" ? document.createTextNode(k) : k); });
  return e;
}

var TABS = [
  ["dash","Dashboard"], ["items","Inventory"], ["purchases","Purchases"],
  ["sales","Sales"], ["lowstock","Low Stock"], ["settings","Settings"]
];

function render(){
  document.body.setAttribute("data-dark", STATE.settings.dark ? "1" : "0");
  var app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderHeader());
  var main = el("main", {}, []);
  if(VIEW === "dash") main.appendChild(viewDash());
  else if(VIEW === "items") main.appendChild(viewItems());
  else if(VIEW === "purchases") main.appendChild(viewMovements("purchase"));
  else if(VIEW === "sales") main.appendChild(viewMovements("sale"));
  else if(VIEW === "lowstock") main.appendChild(viewLowStock());
  else if(VIEW === "settings") main.appendChild(viewSettings());
  app.appendChild(main);
  app.appendChild(renderFooter());
  showModal();
}

function renderHeader(){
  var nav = el("nav", { class: "tabs" }, TABS.map(function(t){
    return el("button", { class: (VIEW===t[0]?"active ":"")+"", onclick: function(){ VIEW = t[0]; render(); } }, [t[1]]);
  }));
  return el("header", { class: "top" }, [
    el("div", { class: "toprow" }, [
      el("div", { class: "brand" }, [ el("span",{class:"box"},[]), "Inventory Tracker" ]),
      nav,
      el("div", { class: "spacer" }, []),
      el("button", { class: "iconbtn", onclick: function(){ STATE.settings.dark = !STATE.settings.dark; save(); render(); } }, [ STATE.settings.dark ? "Light mode" : "Dark mode" ])
    ])
  ]);
}
function renderFooter(){
  return el("footer", { class: "note" }, ["100% offline. No account, no subscription. Your data stays in this browser."]);
}

function statusOf(item){
  var q = Number(item.qty)||0, rp = Number(item.reorderPoint)||0;
  if(item.status !== "active") return "archived";
  if(q <= 0) return "out";
  if(q <= rp) return "low";
  return "ok";
}
function statusLabel(s){ return { ok:"In stock", low:"Low stock", out:"Out of stock", archived:"Archived" }[s]; }

/* ---------- Dashboard ---------- */
function viewDash(){
  var cur = STATE.settings.currency;
  var sv = stockValue(STATE.items);
  var rv = retailValue(STATE.items);
  var pp = potentialProfit(STATE.items);
  var units = totalUnits(STATE.items);
  var low = lowStockItems(STATE.items);
  var out = outOfStockCount(STATE.items);
  var mv = mostValuable(STATE.items);
  var movers = topMovers(STATE.movements, STATE.items, toISO(addDays(parseISO(todayISO()),-30)), todayISO());

  var kpis = el("div", { class: "grid4" }, [
    kpiCard("STOCK VALUE (COST)", formatMoney(sv, cur), units + " units on hand"),
    kpiCard("RETAIL VALUE", formatMoney(rv, cur), "if sold at list price"),
    kpiCard("POTENTIAL PROFIT", formatMoney(pp, cur), "retail minus cost", "var(--ok)"),
    kpiCard("NEEDS ATTENTION", String(low.length), out + " completely out of stock", low.length ? "var(--warn)" : "var(--ink)")
  ]);

  var lowCard = el("div", { class: "card" }, [
    el("h2", {}, ["Low stock"]),
    el("p", { class: "hint" }, ["At or below reorder point. Click Low Stock for the full list."]),
    low.length ? el("div", {}, low.slice(0,6).map(lowRow)) : el("div", { class: "empty" }, ["Nothing low right now."])
  ]);
  var moversCard = el("div", { class: "card" }, [
    el("h2", {}, ["Top movers (30 days)"]),
    el("p", { class: "hint" }, ["Units sold, most recent 30 days."]),
    movers.length ? el("div", {}, movers.slice(0,6).map(function(m){
      return el("div", { class:"list-item" }, [
        el("span", {}, [m.item.name]),
        el("span", { style:"font-weight:bold;" }, [m.unitsSold + " sold"])
      ]);
    })) : el("div", { class: "empty" }, ["No sales logged in the last 30 days."])
  ]);
  return el("div", {}, [ kpis, el("div", { class: "grid2" }, [ lowCard, moversCard ]) ]);
}
function kpiCard(label, val, sub, colour){
  return el("div", { class: "card kpi" }, [
    el("div", { class: "label" }, [label]),
    el("div", { class: "val", style: colour ? ("color:"+colour) : "" }, [val]),
    el("div", { class: "sub" }, [sub])
  ]);
}
function lowRow(i){
  var s = statusOf(i);
  return el("div", { class: "list-item" }, [
    el("div", {}, [ el("strong", {}, [i.name]), el("div", { style:"font-size:12px;color:var(--grey);" }, [i.sku]) ]),
    el("div", { style: "text-align:right;" }, [
      el("span", { class: "pill " + s }, [statusLabel(s)]),
      el("div", { style: "font-size:12px;color:var(--grey);margin-top:4px;" }, [i.qty + " on hand / reorder at " + i.reorderPoint])
    ])
  ]);
}

/* ---------- Inventory list ---------- */
function viewItems(){
  var cur = STATE.settings.currency;
  var rows = STATE.items.map(function(i){
    var s = statusOf(i);
    return el("tr", {}, [
      el("td", {}, [ el("strong", {}, [i.name]), el("div", { style:"font-size:12px;color:var(--grey);" }, [i.sku]) ]),
      el("td", {}, [i.category]),
      el("td", {}, [String(i.qty)]),
      el("td", {}, [ formatMoney(i.unitCost, cur) ]),
      el("td", {}, [ formatMoney((Number(i.qty)||0)*(Number(i.unitCost)||0), cur) ]),
      el("td", {}, [ el("span", { class: "pill " + s }, [statusLabel(s)]) ]),
      el("td", {}, [
        el("button", { class: "btn ghost small", onclick: function(){ openEdit(i.id); } }, ["Edit"])
      ])
    ]);
  });
  return el("div", {}, [
    el("div", { class: "row" }, [
      el("h2", {}, ["All items"]),
      el("button", { class: "btn", onclick: function(){ openEdit(null); } }, ["+ Add item"])
    ]),
    el("div", { class: "card" }, [
      STATE.items.length ?
      el("table", {}, [
        el("thead", {}, [ el("tr", {}, ["Item","Category","On hand","Unit cost","Value","Status",""].map(function(h){ return el("th",{},[h]); })) ]),
        el("tbody", {}, rows)
      ]) : el("div", { class: "empty" }, ["No items yet. Add your first one."])
    ])
  ]);
}

/* ---------- Purchases / Sales log ---------- */
function viewMovements(type){
  var cur = STATE.settings.currency;
  var list = STATE.movements.filter(function(m){ return m.type === type; }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var rows = list.map(function(m){
    var item = STATE.items.find(function(i){ return i.id === m.itemId; });
    return el("tr", {}, [
      el("td", {}, [m.date]),
      el("td", {}, [ item ? item.name : "(deleted item)" ]),
      el("td", {}, [String(m.qty)]),
      el("td", {}, [ type === "purchase" ? formatMoney(m.unitCost, cur) : "â" ]),
      el("td", {}, [m.notes || ""])
    ]);
  });
  var label = type === "purchase" ? "Purchases (stock received)" : "Sales (stock sold)";
  return el("div", {}, [
    el("div", { class: "row" }, [
      el("h2", {}, [label]),
      el("button", { class: "btn", onclick: function(){ openMove(type); } }, [ type === "purchase" ? "+ Receive stock" : "+ Record sale" ])
    ]),
    el("div", { class: "card" }, [
      list.length ?
      el("table", {}, [
        el("thead", {}, [ el("tr", {}, ["Date","Item","Qty", type === "purchase" ? "Unit cost" : "", "Notes"].map(function(h){ return el("th",{},[h]); })) ]),
        el("tbody", {}, rows)
      ]) : el("div", { class: "empty" }, ["Nothing logged yet."])
    ])
  ]);
}

/* ---------- Low stock ---------- */
function viewLowStock(){
  var cur = STATE.settings.currency;
  var low = lowStockItems(STATE.items);
  return el("div", {}, [
    el("h2", {}, ["Low stock & out of stock"]),
    el("p", { class: "hint" }, ["Every active item at or below its reorder point, lowest quantity first."]),
    el("div", { class: "card" }, [
      low.length ? el("div", {}, low.map(lowRow)) : el("div", { class: "empty" }, ["Nothing needs reordering right now."])
    ])
  ]);
}

/* ---------- Settings ---------- */
function viewSettings(){
  return el("div", {}, [
    el("h2", {}, ["Settings"]),
    el("div", { class: "card", style:"margin-bottom:16px;" }, [
      el("div", { class:"field" }, [ el("label",{},["Currency symbol"]),
        el("input", { value: STATE.settings.currency, oninput: function(e){ STATE.settings.currency = e.target.value || "$"; save(); render(); } }) ])
    ]),
    el("div", { class: "card" }, [
      el("h2", {}, ["Your data"]),
      el("p", { class:"hint" }, ["Everything lives in this browser's local storage. Nothing is uploaded anywhere."]),
      el("button", { class:"btn ghost", style:"margin-right:8px;", onclick: exportData }, ["Export backup (.json)"]),
      el("button", { class:"btn ghost", onclick: function(){
        var inp = document.createElement("input"); inp.type="file"; inp.accept="application/json";
        inp.onchange = function(e){ importData(e.target.files[0]); };
        inp.click();
      } }, ["Import backup"]),
      el("button", { class:"btn ghost", style:"margin-left:8px;color:var(--bad);", onclick: function(){
        if(confirm("Reset all data? This cannot be undone.")){ STATE = { settings:{currency:"$",dark:false}, items:[], movements:[] }; save(); render(); }
      } }, ["Reset all data"])
    ])
  ]);
}
function exportData(){
  var blob = new Blob([JSON.stringify(STATE,null,2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = "inventory-tracker-backup.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function importData(file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var st = JSON.parse(e.target.result);
      if(st && st.items){ STATE = st; save(); render(); }
    }catch(err){ alert("Could not read that file."); }
  };
  reader.readAsText(file);
}

/* ---------- Add / Edit item modal ---------- */
function openEdit(id){ EDIT_ID = id; MOVE_ITEM_ID = null; MODAL_OPEN = "edit"; render(); }
function openMove(type){ MOVE_ITEM_ID = "new"; MODAL_OPEN = "move-" + type; render(); }
function closeModal(){ MODAL_OPEN = false; EDIT_ID = null; MOVE_ITEM_ID = null; render(); }

function showModal(){
  var app = document.getElementById("app");
  var existing = document.getElementById("invModalBg");
  if(existing) existing.remove();
  if(!MODAL_OPEN) return;
  if(MODAL_OPEN === "edit") return showEditModal(app);
  if(MODAL_OPEN.indexOf("move-") === 0) return showMoveModal(app, MODAL_OPEN.slice(5));
}

function showEditModal(app){
  var s = EDIT_ID === null ? null : STATE.items.find(function(x){ return x.id === EDIT_ID; });
  var isNew = !s;
  var draft = s ? JSON.parse(JSON.stringify(s)) : { id: uid(), sku:"", name:"", category:CATEGORIES[0], qty:0, reorderPoint:0, unitCost:"", unitPrice:"", status:"active", notes:"" };

  var skuInput = el("input", { value: draft.sku, oninput: function(e){ draft.sku = e.target.value; } });
  var nameInput = el("input", { value: draft.name, oninput: function(e){ draft.name = e.target.value; } });
  var catSelect = el("select", {}, CATEGORIES.map(function(c){ var o=el("option",{value:c},[c]); if(c===draft.category) o.selected=true; return o; }));
  catSelect.addEventListener("change", function(e){ draft.category = e.target.value; });
  var qtyInput = el("input", { type:"number", step:"1", value: draft.qty, oninput: function(e){ draft.qty = e.target.value; } });
  var reorderInput = el("input", { type:"number", step:"1", value: draft.reorderPoint, oninput: function(e){ draft.reorderPoint = e.target.value; } });
  var costInput = el("input", { type:"number", step:"0.01", value: draft.unitCost, oninput: function(e){ draft.unitCost = e.target.value; } });
  var priceInput = el("input", { type:"number", step:"0.01", value: draft.unitPrice, oninput: function(e){ draft.unitPrice = e.target.value; } });
  var statusSelect = el("select", {}, ["active","archived"].map(function(c){ var o=el("option",{value:c},[c]); if(c===draft.status) o.selected=true; return o; }));
  statusSelect.addEventListener("change", function(e){ draft.status = e.target.value; });
  var notesInput = el("textarea", { rows:2, oninput: function(e){ draft.notes = e.target.value; } }, [draft.notes||""]);

  var modal = el("div", { class:"modal" }, [
    el("h3", {}, [ isNew ? "Add item" : "Edit item" ]),
    el("div", { class: "formgrid" }, [
      el("div", { class: "field" }, [ el("label",{},["SKU"]), skuInput ]),
      el("div", { class: "field" }, [ el("label",{},["Category"]), catSelect ]),
      el("div", { class: "field", style:"grid-column:1/-1;" }, [ el("label",{},["Name"]), nameInput ]),
      el("div", { class: "field" }, [ el("label",{},["Qty on hand"]), qtyInput ]),
      el("div", { class: "field" }, [ el("label",{},["Reorder point"]), reorderInput ]),
      el("div", { class: "field" }, [ el("label",{},["Unit cost"]), costInput ]),
      el("div", { class: "field" }, [ el("label",{},["Unit price (optional)"]), priceInput ]),
      el("div", { class: "field" }, [ el("label",{},["Status"]), statusSelect ])
    ]),
    el("div", { class: "field" }, [ el("label",{},["Notes"]), notesInput ]),
    el("div", { class: "row", style:"margin-top:6px;" }, [
      isNew ? el("span",{},[]) : el("button", { class:"btn ghost", style:"color:var(--bad);", onclick: function(){
        if(confirm("Delete this item?")){ STATE.items = STATE.items.filter(function(x){ return x.id !== draft.id; }); save(); closeModal(); }
      } }, ["Delete"]),
      el("div", {}, [
        el("button", { class:"btn ghost", style:"margin-right:8px;", onclick: closeModal }, ["Cancel"]),
        el("button", { class:"btn", onclick: function(){
          if(!draft.name || !draft.sku){ alert("SKU and name are required."); return; }
          draft.qty = Number(draft.qty)||0; draft.reorderPoint = Number(draft.reorderPoint)||0;
          draft.unitCost = Number(draft.unitCost)||0; draft.unitPrice = Number(draft.unitPrice)||0;
          if(isNew){ if(demoLimitReached()) return; STATE.items.push(draft); } else { STATE.items = STATE.items.map(function(x){ return x.id === draft.id ? draft : x; }); }
          save(); closeModal();
        } }, [ isNew ? "Add item" : "Save changes" ])
      ])
    ])
  ]);
  var bg = el("div", { class:"modal-bg open", id:"invModalBg", onclick: function(e){ if(e.target.id === "invModalBg") closeModal(); } }, [modal]);
  app.appendChild(bg);
}

function showMoveModal(app, type){
  var itemId = STATE.items.length ? STATE.items[0].id : null;
  var qty = "";
  var unitCost = "";
  var date = todayISO();
  var notes = "";
  var itemSelect = el("select", {}, STATE.items.map(function(i){ var o=el("option",{value:i.id},[i.name + " (" + i.sku + ")"]); if(i.id===itemId) o.selected=true; return o; }));
  itemSelect.addEventListener("change", function(e){ itemId = e.target.value; });
  var qtyInput = el("input", { type:"number", step:"1", value:"", oninput: function(e){ qty = e.target.value; } });
  var costField = type === "purchase" ? el("input", { type:"number", step:"0.01", value:"", oninput: function(e){ unitCost = e.target.value; } }) : null;
  var dateInput = el("input", { type:"date", value: date, oninput: function(e){ date = e.target.value; } });
  var notesInput = el("textarea", { rows:2, oninput: function(e){ notes = e.target.value; } }, []);

  var fields = [
    el("div", { class: "field" }, [ el("label",{},["Item"]), itemSelect ]),
    el("div", { class: "field" }, [ el("label",{}, [ type === "purchase" ? "Quantity received" : "Quantity sold" ]), qtyInput ]),
  ];
  if(type === "purchase") fields.push(el("div", { class: "field" }, [ el("label",{},["Unit cost (optional â updates weighted average)"]), costField ]));
  fields.push(el("div", { class: "field" }, [ el("label",{},["Date"]), dateInput ]));
  fields.push(el("div", { class: "field" }, [ el("label",{},["Notes"]), notesInput ]));

  var modal = el("div", { class:"modal" }, [
    el("h3", {}, [ type === "purchase" ? "Receive stock" : "Record a sale" ])
  ].concat(fields).concat([
    el("div", { class: "row", style:"margin-top:6px;justify-content:flex-end;" }, [
      el("button", { class:"btn ghost", style:"margin-right:8px;", onclick: closeModal }, ["Cancel"]),
      el("button", { class:"btn", onclick: function(){
        var q = Number(qty)||0;
        if(!itemId || q <= 0){ alert("Choose an item and a quantity greater than zero."); return; }
        var item = STATE.items.find(function(x){ return x.id === itemId; });
        if(!item) return;
        var updated = applyMovement(item, type, q, type === "purchase" ? unitCost : undefined);
        STATE.items = STATE.items.map(function(x){ return x.id === itemId ? updated : x; });
        STATE.movements.push({ id: uid(), itemId: itemId, type: type, qty: q, date: date, unitCost: type === "purchase" ? (Number(unitCost)||item.unitCost) : undefined, notes: notes });
        save(); closeModal();
      } }, [ type === "purchase" ? "Receive stock" : "Record sale" ])
    ])
  ]));
  var bg = el("div", { class:"modal-bg open", id:"invModalBg", onclick: function(e){ if(e.target.id === "invModalBg") closeModal(); } }, [modal]);
  app.appendChild(bg);
}

render();

if(typeof window !== "undefined"){
  window.__invTrackerTest = {
    render: render,
    getState: function(){ return STATE; },
    setState: function(st){ STATE = st; },
    setView: function(v){ VIEW = v; render(); },
    openEdit: openEdit,
    openMove: openMove,
    closeModal: closeModal
  };
}
})();
</script>
